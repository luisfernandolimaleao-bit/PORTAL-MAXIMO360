<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101119">
<link rel="icon" href="logo-icon-header-navy.webp" type="image/webp">
<title>Página não encontrada · Amil PME · Maximo 360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Lato:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --blue: #1741C4; --blue-dark: #0F2E8F; --navy: #1A1C28; --white: #FFFFFF; --off-white: #F6F8FC; --gray: #6B7280; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Lato', sans-serif; background: var(--off-white); color: var(--navy);
    min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .code { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: clamp(64px, 14vw, 110px); line-height: 1; color: var(--blue); letter-spacing: -2px; }
  h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px; margin: 10px 0 12px; }
  p { color: var(--gray); font-size: 15px; line-height: 1.6; max-width: 420px; margin: 0 auto 28px; }
  .btn {
    display: inline-block; background: var(--blue); color: var(--white); text-decoration: none;
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 14px 30px; border-radius: 8px;
    box-shadow: 0 8px 22px rgba(23,65,196,0.28); transition: background 0.2s, transform 0.2s;
  }
  .btn:hover { background: var(--blue-dark); transform: translateY(-1px); }
  .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
  .brand { margin-top: 34px; font-size: 12px; color: var(--gray); }
  .brand strong { color: var(--blue); }
</style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço acessado não existe ou foi movido. Volte para o guia do corretor Amil PME.</p>
    <a class="btn" href="index.html">Voltar ao início</a>
    <p class="brand">© 2026 <strong>Maximo 360</strong></p>
  </div>
</body>
</html>
